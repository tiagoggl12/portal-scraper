name: Daily Data Scraper

on:
  schedule:
    # Runs every day at 6 AM UTC (3 AM BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions: contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Create data directory
      run: mkdir -p data logs

    - name: Download existing database (if available)
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: data/despesas.db
        key: despesas-db-${{ github.run_id }}
        restore-keys: |
          despesas-db-

    - name: Run scraper
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python3 scraper.py
      continue-on-error: true

    - name: Commit new data
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/despesas.db || true
        git add logs/scheduler.log || true
        git diff --staged --quiet || git commit -m "Update data - $(date +'%Y-%m-%d')"
        git push

    - name: Upload database as artifact
      uses: actions/upload-artifact@v4
      with:
        name: despesas-db
        path: data/despesas.db
        retention-days: 90
